<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Global English Academy - Premium English Language, IELTS, PTE, Spoken English, and Interview Coaching.">
    <title>Global English Academy | Master English & Excel Globally</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==================== CSS VARIABLES & RESET ==================== */
        :root {
            --primary-blue: #1e3a8a;
            --secondary-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --gradient-primary: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            --gradient-accent: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            --dark-bg: #0f172a;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --text-dark: #0f172a;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            background-color: var(--light-bg);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-padding {
            padding: 80px 0;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px auto;
        }

        .section-header h2 {
            font-size: 2.2rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .section-header h2::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 4px;
            background: var(--gradient-accent);
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
            text-align: center;
        }

        .btn-primary {
            background: var(--gradient-accent);
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
        }

        .btn-secondary:hover {
            background: #fff;
            color: var(--primary-blue);
            transform: translateY(-3px);
        }

        /* ==================== HEADER & NAV ==================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            transition: var(--transition);
            padding: 20px 0;
            background: transparent;
        }

        header.scrolled {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 0;
            box-shadow: var(--shadow-sm);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            transition: var(--transition);
        }

        header.scrolled .logo {
            color: var(--text-dark);
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            background: var(--gradient-accent);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            display: inline-block;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #fff;
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            position: relative;
        }

        header.scrolled .nav-links a {
            color: var(--text-main);
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
        }

        .mobile-toggle {
            display: none;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
        }

        header.scrolled .mobile-toggle {
            color: var(--text-dark);
        }

        /* ==================== HERO SECTION ==================== */
        .hero {
            position: relative;
            min-height: 100vh;
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            color: #fff;
            padding-top: 80px;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.15rem;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        .hero-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 60px;
        }

        /* Stats Bar */
        .hero-stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: var(--radius-lg);
            gap: 20px;
        }

        .stat-item h3 {
            font-size: 2.2rem;
            color: #fff;
            font-weight: 700;
        }

        .stat-item p {
            margin-bottom: 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* ==================== ABOUT SECTION ==================== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-image {
            position: relative;
        }

        .about-image img {
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .about-experience-card {
            position: absolute;
            bottom: -20px;
            right: -20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .about-experience-card i {
            font-size: 2rem;
            color: var(--secondary-blue);
        }

        .about-content h3 {
            font-size: 1.8rem;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        .about-features {
            margin-top: 25px;
        }

        .about-feature-item {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .about-feature-item i {
            color: var(--accent-cyan);
            font-size: 1.2rem;
            margin-top: 3px;
        }

        /* ==================== COURSES SECTION ==================== */
        .courses {
            background-color: #f1f5f9;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .course-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .course-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .course-img {
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .course-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .course-card:hover .course-img img {
            transform: scale(1.05);
        }

        .course-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gradient-accent);
            color: #fff;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .course-body {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .course-body h3 {
            font-size: 1.3rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .course-body p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .course-link {
            color: var(--secondary-blue);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }

        /* ==================== WHY CHOOSE US ==================== */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .feature-card:hover {
            border-color: var(--secondary-blue);
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--secondary-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .feature-card h3 {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .feature-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* ==================== TIMELINE / ADMISSION ==================== */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 3px;
            background: var(--border-color);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -1.5px;
        }

        .timeline-item {
            padding: 10px 40px;
            position: relative;
            width: 50%;
            box-sizing: border-box;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            right: -8px;
            background-color: var(--card-bg);
            border: 4px solid var(--secondary-blue);
            top: 15px;
            border-radius: 50%;
            z-index: 1;
        }

        .left { left: 0; }
        .right { left: 50%; }

        .right::after { left: -8px; }

        .timeline-content {
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }

        .timeline-content h3 {
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        /* ==================== TESTIMONIALS SLIDER ==================== */
        .testimonials {
            background: var(--gradient-primary);
            color: #fff;
            overflow: hidden;
        }

        .testimonials .section-header h2,
        .testimonials .section-header p {
            color: #fff;
        }

        .testimonial-slider {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            min-height: 250px;
        }

        .testimonial-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-align: center;
        }

        .testimonial-slide.active {
            opacity: 1;
            position: relative;
        }

        .testimonial-text {
            font-size: 1.1rem;
            font-style: italic;
            margin-bottom: 25px;
            color: #e2e8f0;
        }

        .testimonial-user {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .testimonial-user img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
        }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
        }

        .dot.active {
            background: var(--accent-cyan);
            width: 25px;
            border-radius: 10px;
        }

        /* ==================== TRAINERS ==================== */
        .trainers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .trainer-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            text-align: center;
            transition: var(--transition);
        }

        .trainer-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .trainer-img {
            height: 250px;
            overflow: hidden;
        }

        .trainer-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .trainer-card:hover .trainer-img img {
            transform: scale(1.05);
        }

        .trainer-info {
            padding: 20px;
        }

        .trainer-info h3 {
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        .trainer-info p {
            font-size: 0.85rem;
            color: var(--secondary-blue);
            margin-bottom: 10px;
        }

        /* ==================== FAQ ACCORDION ==================== */
        .faq-accordion {
            max-width: 800px;
            margin: 0 auto;
        }

        .faq-item {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            margin-bottom: 15px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .faq-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-dark);
        }

        .faq-content {
            padding: 0 20px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .faq-item.active .faq-content {
            padding: 0 20px 20px 20px;
            max-height: 200px;
        }

        .faq-item.active .faq-header i {
            transform: rotate(180deg);
        }

        /* ==================== CONTACT ==================== */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-item {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .contact-item i {
            width: 45px;
            height: 45px;
            background: rgba(59, 130, 246, 0.1);
            color: var(--secondary-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .map-placeholder {
            width: 100%;
            height: 200px;
            background: #cbd5e1;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            margin-top: 20px;
        }
